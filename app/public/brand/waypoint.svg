<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Waypoint">
  <!--
    An aeronautical chart waypoint: a named point is drawn as a triangle, with
    the point itself at the centroid. Real provenance rather than a generic pin,
    and no aeroplane — every travel app has an aeroplane.

    The dot is `currentColor` so the mark works on paper and on ink without a
    second file; the triangle takes the accent.
  -->
  <path d="M32 9 L56 51 H8 Z"
        fill="none" stroke="var(--accent, #b45309)" stroke-width="6"
        stroke-linejoin="round" />
  <circle cx="32" cy="35" r="4.2" fill="var(--accent, #b45309)" />
</svg>
